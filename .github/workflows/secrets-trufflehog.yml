name: Secrets sweep (TruffleHog)

# Monthly backstop for secrets that predate the pre-commit hook or bypassed
# it via --no-verify. Notification-only: a red run IS the alert (fail-the-run).
# Manual dry runs: gh workflow run secrets-trufflehog.yml
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: TruffleHog history sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog scan (unverified, fail-the-run alerting)
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          # Image tags omit the leading v; keep in sync with the action pin above.
          version: 3.97.4
          extra_args: --no-verification --no-update
