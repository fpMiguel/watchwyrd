name: Secrets sweep (TruffleHog)

# Monthly backstop for secrets that predate the pre-commit hook or bypassed
# it via --no-verify. Notification-only: a red run IS the alert (fail-the-run).
# Manual dry runs: gh workflow run secrets-trufflehog.yml
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: TruffleHog history sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog scan (unverified, fail-the-run alerting)
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          # Image tags omit the leading v; keep in sync with the action pin above.
          version: 3.100.1
          # NOTE: do NOT pass --no-update here; the action already adds it internally
          # (duplicating it fails with "flag 'no-update' cannot be repeated").
          extra_args: --no-verification
