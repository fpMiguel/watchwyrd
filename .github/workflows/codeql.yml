# CodeQL advanced setup — replaces GitHub default setup.
# Query suite: security-extended. CI fails on error-severity findings.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan of the default branch (Monday 06:00 UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: javascript-typescript

      # Ground-truth gate: read the processed analysis as GitHub stores it
      # (the same data the Security tab shows). The local CLI SARIF file is
      # unreliable for gating (severity lives on rules; raw results may omit
      # ruleIndex). The stored SARIF carries result.level — simple jq.
      - name: Fail on CodeQL error findings
        shell: bash
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/code-scanning/analyses"
          auth="Authorization: Bearer ${GH_TOKEN}"
          ver="X-GitHub-Api-Version: 2022-11-28"
          sha="${GITHUB_SHA}"

          analysis_id=""
          for i in $(seq 1 30); do # 30 x 10s = 5 min budget; fail-closed on timeout
            list="$(curl -fsSL -G -H "Accept: application/vnd.github+json" -H "$auth" -H "$ver" \
              --data-urlencode "ref=${GITHUB_REF}" --data-urlencode "per_page=100" \
              "$api" 2>/dev/null || true)"
            analysis_id="$(printf '%s' "$list" | jq -r --arg sha "$sha" \
              '[.[] | select(.commit_sha == $sha and (.category // "" | contains("javascript-typescript")))]
               | sort_by(.created_at) | .[-1].id // empty')"
            [ -n "$analysis_id" ] && break
            [ "$i" -eq 30 ] && {
              echo "::error::Timed out waiting for code-scanning analysis ${GITHUB_REF}@${sha}"
              exit 1
            }
            sleep 10
          done

          sarif="$(curl -fsSL -H "Accept: application/sarif+json" -H "$auth" -H "$ver" \
            "${api}/${analysis_id}")"
          total="$(printf '%s' "$sarif" | jq '[.runs[].results[]?] | length')"
          errors="$(printf '%s' "$sarif" | jq '[.runs[].results[]? | select(.level == "error")] | length')"
          warnings="$(printf '%s' "$sarif" | jq '[.runs[].results[]? | select(.level == "warning")] | length')"
          echo "CodeQL (ground truth): ${total} result(s), ${errors} error(s), ${warnings} warning(s)"
          if [ "$warnings" -gt 0 ]; then
            printf '%s' "$sarif" | jq -r '.runs[].results[]? | select(.level == "warning") | "warning: \(.message.text) [\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)]"'
          fi
          if [ "$errors" -gt 0 ]; then
            echo "::error::CodeQL found ${errors} error-severity finding(s)"
            printf '%s' "$sarif" | jq -r '.runs[].results[]? | select(.level == "error") | "error: \(.message.text) [\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)]"'
            exit 1
          fi
