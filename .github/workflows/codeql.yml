# CodeQL advanced setup — replaces GitHub default setup.
# Query suite: security-extended. CI fails on error-severity findings.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan of the default branch (Monday 06:00 UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          category: javascript-typescript
          upload: false

      - name: Fail on CodeQL error findings
        run: |
          shopt -s nullglob
          sarif_files=(sarif-results/*.sarif)
          if [ ${#sarif_files[@]} -eq 0 ]; then
            echo "::error::No SARIF results file produced by CodeQL"
            exit 1
          fi
          # CodeQL writes severity on the rule (tool.driver.rules[].defaultConfiguration.level),
          # not on the result — map it the same way GitHub's backend does.
          # Null-safe: some raw results carry no ruleIndex (GitHub filters them later).
          JQ_LEVEL='((.level // (if (.ruleIndex != null and ($run.tool.driver.rules? != null)) then (($run.tool.driver.rules[.ruleIndex] // {}).defaultConfiguration // {}).level else null end) // "warning")'
          JQ_ERRORS='[.runs[] | . as $run | .results[]? | '"$JQ_LEVEL"' | select(. == "error")] | length'
          JQ_WARNINGS='[.runs[] | . as $run | .results[]? | '"$JQ_LEVEL"' | select(. == "warning")] | length'
          errors=0
          warnings=0
          for f in "${sarif_files[@]}"; do
            e=$(jq "$JQ_ERRORS" "$f")
            w=$(jq "$JQ_WARNINGS" "$f")
            errors=$((errors + e))
            warnings=$((warnings + w))
            echo "SARIF $f: $e error(s), $w warning(s)"
          done
          echo "CodeQL findings: $errors error(s), $warnings warning(s)"
          if [ "$warnings" -gt 0 ]; then
            for f in "${sarif_files[@]}"; do
              jq -r '.runs[] | . as $run | .results[]? | '"$JQ_LEVEL"' | select(. == "warning") | "warning: \(.message.text) [\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)]"' "$f"
            done
          fi
          if [ "$errors" -gt 0 ]; then
            echo "::error::CodeQL found $errors error-severity finding(s)"
            for f in "${sarif_files[@]}"; do
              jq -r '.runs[] | . as $run | .results[]? | '"$JQ_LEVEL"' | select(. == "error") | "error: \(.message.text) [\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)]"' "$f"
            done
            exit 1
          fi

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
