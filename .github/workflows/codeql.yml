# CodeQL advanced setup — replaces GitHub default setup.
# Query suite: security-extended. CI fails on error-severity findings.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan of the default branch (Monday 06:00 UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          category: javascript-typescript

      - name: Fail on CodeQL error findings
        run: |
          sarif_file=$(find sarif-results -name '*.sarif' | head -n 1)
          if [ ! -f "$sarif_file" ]; then
            echo "::error::No SARIF results file produced by CodeQL"
            exit 1
          fi
          errors=$(jq '[.runs[].results[] | select(.level == "error")] | length' "$sarif_file")
          warnings=$(jq '[.runs[].results[] | select(.level == "warning")] | length' "$sarif_file")
          echo "CodeQL findings: $errors error(s), $warnings warning(s)"
          if [ "$warnings" -gt 0 ]; then
            jq -r '.runs[].results[] | select(.level == "warning") | "warning: \(.message.text) [\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)]"' "$sarif_file"
          fi
          if [ "$errors" -gt 0 ]; then
            echo "::error::CodeQL found $errors error-severity finding(s)"
            jq -r '.runs[].results[] | select(.level == "error") | "error: \(.message.text) [\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)]"' "$sarif_file"
            exit 1
          fi
